<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">

    <title>Medicore - Buscar Pacientes</title>

    <!-- Custom fonts -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .btn-purple {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            opacity: 0.9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3);
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.25);
        }

        .avatar-initial {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(111, 66, 193, 0.1);
            color: var(--accent-purple);
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <aside th:replace="~{fragments/employeeSidebar :: employeeSidebar}"></aside>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="p-4 bg-light">

                <!-- Encabezado de la página -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800 font-weight-bold">
                        <i class="bi bi-search text-purple mr-2"></i>Búsqueda de Pacientes
                    </h1>
                </div>

                <!-- Card de Filtros de Búsqueda -->
                <div class="card shadow mb-4">
                    <div class="card-body">
                        <form class="row align-items-end">
                            <div class="col-md-4 mb-3 mb-md-0">
                                <label class="form-label text-gray-700 font-weight-bold small">Documento</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white"><i class="bi bi-search text-purple"></i></span>
                                    </div>
                                    <input type="text" class="form-control" placeholder="Ej. 1020304050 o Carlos Gómez...">
                                </div>
                            </div>

                            <div class="col-md-4 mb-3 mb-md-0">
                                <label class="form-label text-gray-700 font-weight-bold small">Nombre</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white"><i class="bi bi-search text-purple"></i></span>
                                    </div>
                                    <input type="text" class="form-control" placeholder="Ej. 1020304050 o Carlos Gómez...">
                                </div>
                            </div>


                            <div class="col-md-3">
                                <button type="button" class="btn btn-purple btn-block font-weight-bold">
                                    <i class="bi bi-funnel-fill mr-1"></i> Buscar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Tabla de Resultados -->
                <div class="card shadow card-custom mb-4">
                    <div class="card-header py-3 bg-white d-flex justify-content-between align-items-center">
                        <h6 class="m-0 font-weight-bold text-purple">
                            <i class="bi bi-people-fill mr-2"></i>Pacientes Registrados
                        </h6>
                        <span class="badge badge-light text-purple p-2 border font-weight-bold">Total: 3</span>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light text-gray-700">
                                    <tr>
                                        <th>Paciente</th>
                                        <th>Documento</th>
                                        <th>Contacto</th>
                                        <th>RH</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr>
                                        <td>
                                            <div class="d-flex align-items-center">
                                                <div class="avatar-initial mr-3">CG</div>
                                                <div>
                                                    <div class="font-weight-bold text-gray-800">Carlos Gómez</div>
                                                    <div class="small text-gray-500">carlos.gomez@email.com</div>
                                                </div>
                                            </div>
                                        </td>
                                        <td class="align-middle">CC 1020304050</td>
                                        <td class="align-middle">+57 300 123 4567</td>
                                        <td class="align-middle">
                                            <span class="badge badge-light text-dark border">EPS Sura</span>
                                        </td>
                                        <td class="align-middle font-weight-bold text-purple">O+</td>
                                        <td class="align-middle text-center">
                                            <button type="button" class="btn btn-sm btn-light border text-purple mr-1" title="Ver Historia Clínica">
                                                <i class="bi bi-journal-medical"></i>
                                            </button>
                                            <button type="button" class="btn btn-sm btn-light border text-primary mr-1" title="Editar Paciente">
                                                <i class="bi bi-pencil-square"></i>
                                            </button>
                                            <button type="button" class="btn btn-sm btn-light border text-success" title="Agendar Cita">
                                                <i class="bi bi-calendar-plus"></i>
                                            </button>
                                        </td>
                                    </tr>

                                    
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <!-- Paginador -->
                    <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3">
                        <span class="small text-gray-600">Mostrando 1 a 3 de 3 registros</span>
                        <ul class="pagination pagination-sm mb-0">
                            <li class="page-item disabled"><a class="page-link" href="#">Anterior</a></li>
                            <li class="page-item active"><a class="page-link bg-purple-gradient border-0" href="#">1</a></li>
                            <li class="page-item disabled"><a class="page-link" href="#">Siguiente</a></li>
                        </ul>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>Medicore System &copy; 2026</span>
                    </div>
                </div>
            </footer>

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

</body>
</html>
