<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">

    <title>Medicore - Nueva Prescripción</title>

    <!-- Custom fonts -->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles -->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .btn-purple {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            opacity: 0.9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3);
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.25);
        }

        .section-title {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--accent-purple);
            border-bottom: 2px solid #eaecf4;
            padding-bottom: 0.5rem;
            margin-bottom: 1.25rem;
        }
    </style>
</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <aside th:replace="~{fragments/employeeSidebar :: employeeSidebar}"></aside>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="p-4 bg-light">

                <!-- Encabezado de la página -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800 font-weight-bold">
                        <i class="bi bi-file-earmark-medical-fill text-purple mr-2"></i>Generar Prescripción Médica
                    </h1>
                    
                </div>

                <!-- Formulario Principal de Prescripción -->
                <div class="card shadow card-custom mb-4">
                    <div class="card-header bg-white py-3">
                        <h6 class="m-0 font-weight-bold text-purple">
                            <i class="bi bi-capsule-drop mr-2"></i>Detalles del Recetario
                        </h6>
                    </div>

                    <div class="card-body p-4">
                        <form th:action="@{/employee/createPrescription}" method="post" th:object="${prescription}">
                            
                            <!-- Relación con la Cita -->
                            <div class="section-title">
                                <i class="bi bi-calendar-check mr-2"></i>1. Cita Médica Asociada
                            </div>
                            <div class="form-row mb-3">
                                <div class="form-group col-md-6">
                                    <label class="form-label font-weight-bold small text-gray-700">Seleccionar Cita</label>
                                    <select th:field="*{appointment}" class="form-control" required>
                                        <option value="" disabled selected>Seleccione la cita médica...</option>
                                        <!-- Opciones cargadas dinámicamente -->
                                        <option 
                                            th:each = " appt : ${appointments}"
                                            th:value = ${appt.id}
                                            th:text="'Cita # ' + ${appt.id} + ', Paciente: ' + ${appt.patient.name} + ', ' + ${appt.dateTime}"
                                        ></option>

                                    </select>
                                </div>
                                <div class="form-group col-md-6">
                                    <label class="form-label font-weight-bold small text-gray-700">Medicamento</label>
                                    <select th:field="*{medicine}" class="form-control" required>
                                        <option value="" disabled selected>Seleccione el medicamento del stock...</option>
                                        <!-- Opciones cargadas dinámicamente -->
                                        <option 
                                            th:each = " med : ${medicines}"
                                            th:value = ${med.id}
                                            th:text="${med.name} + ', ' + ${med.quantityPerUnit}"
                                        ></option>
                                    </select>
                                </div>
                            </div>

                            <!-- Dosis e Indicaciones -->
                            <div class="section-title mt-4">
                                <i class="bi bi-card-checklist mr-2"></i>2. Posología e Indicaciones Médicas
                            </div>
                            <div class="form-group mb-3">
                                <label class="form-label font-weight-bold small text-gray-700">Dosis / Posología</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text bg-white"><i class="bi bi-clock-history text-purple"></i></span>
                                    </div>
                                    <input type="text" th:field="*{dosage}" class="form-control" placeholder="Ej. 1 tableta cada 8 horas por 5 días" required>
                                    <span th:if="${#fields.hasErrors('dosage')}" 
                                        th:errors="*{dosage}" 
                                        class="text-danger">Error en dosis</span>
                                </div>
                            </div>

                            <div class="form-group mb-4">
                                <label class="form-label font-weight-bold small text-gray-700">Indicaciones Adicionales</label>
                                <textarea th:field="*{directions}" class="form-control" rows="4" placeholder="Ej. Tomar junto con las comidas. Suspender en caso de reacción alérgica..."></textarea>
                                <span th:if="${#fields.hasErrors('directions')}" 
                                        th:errors="*{directions}" 
                                        class="text-danger">Error en indicaciones</span>
                            </div>

                            <!-- Botones de Acción -->
                            <hr class="my-4">
                            <div class="d-flex justify-content-end">
                                <button type="reset" class="btn btn-light border font-weight-bold mr-2">
                                    <i class="bi bi-eraser-fill mr-1"></i> Limpiar
                                </button>
                                <button type="submit" class="btn btn-purple font-weight-bold px-4">
                                    <i class="bi bi-check-circle-fill mr-1"></i> Guardar Prescripción
                                </button>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>Medicore System &copy; 2026</span>
                    </div>
                </div>
            </footer>

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

</body>
</html>
