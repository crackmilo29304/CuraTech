<!DOCTYPE html>
<html lang="es">

<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">

    <title>Medicore - Mis Prescripciones Activas</title>

    <!-- FontAwesome y Google Fonts -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Bootstrap CSS y Icons -->
    <link href="https://cdn.jsdelivr.net/npm/startbootstrap-sb-admin-2@4.1.4/css/sb-admin-2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .btn-purple {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            opacity: 0.9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3);
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .badge-active {
            background-color: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #a5d6a7;
        }

        .sidebar-mock {
            width: 224px;
            background: var(--primary-gradient);
            min-height: 100vh;
        }
    </style>
</head>

<body id="page-top">

    <div id="wrapper">

        <aside th:replace="fragments/patientSidebar :: patientSidebar"></aside>

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="p-4 bg-light">

                <!-- Encabezado de la página -->
                <div class="d-sm-flex align-items-center justify-content-between mb-4">
                    <h1 class="h3 mb-0 text-gray-800 font-weight-bold">
                        <i class="bi bi-capsule text-purple mr-2"></i> Prescripciones Activas
                    </h1>
                
                </div>

                <!-- Tarjeta Principal con la Tabla -->
                <div class="card shadow card-custom mb-4">
                    <div class="card-header bg-white py-3 d-flex align-items-center justify-content-between">
                        <h6 class="m-0 font-weight-bold text-purple">
                            <i class="bi bi-journal-medical mr-2"></i> Listado de Recetas Vigentes
                        </h6>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="bg-light text-gray-700">
                                    <tr>
                                        <th class="py-3 pl-4">Medicamento</th>
                                        <th class="py-3">Dosis / Posología</th>
                                        <th class="py-3">Indicaciones</th>
                                        <th class="py-3">Vencimiento</th>
                                    </tr>
                                </thead>
                                <tbody>
                                   <tr th:each="prescription : ${activePrescriptions}">
                                        <td th:text="${prescription.medicine.name}"></td>
                                        <td th:text="${prescription.dosage}"></td>
                                        <td th:text="${prescription.directions}"></td>
                                        <td th:text="${prescription.batchStock.expirationDate}"></td>
                                   </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>Medicore System &copy; 2026</span>
                    </div>
                </div>
            </footer>

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>
    <script th:src="@{/js/sb-admin-2.min.js}"></script>
</body>
</html>
