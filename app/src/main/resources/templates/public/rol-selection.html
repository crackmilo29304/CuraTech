<!DOCTYPE html>
<html lang="en">

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">
    <meta charset="utf-8">

    <title>CuraTech</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <!-- Custom styles for this template-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <style>
        * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        /* Imagen de fondo de hospital desde Unsplash con overlay oscuro */
        background: linear-gradient(rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.55)), 
                    url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
        }

        .container {
        background-color: rgba(255, 255, 255, 0.95);
        padding: 2.5rem;
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        text-align: center;
        max-width: 400px;
        width: 90%;
        }

        .container h1 {
        color: #1a365d;
        margin-bottom: 0.5rem;
        font-size: 1.8rem;
        }

        .container p {
        color: #4a5568;
        margin-bottom: 1.8rem;
        font-size: 0.95rem;
        }

        .button-group {
        display: flex;
        flex-direction: column;
        gap: 1rem;
        }

        .btn {
        padding: 0.85rem 1.5rem;
        font-size: 1rem;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.15s ease, background-color 0.2s ease;
        color: #ffffff;
        }

        .btn:hover {
        transform: translateY(-2px);
        }

        .btn:active {
        transform: translateY(0);
        }

        .btn-paciente {
        background-color: #2b6cb0;
        }
        .btn-paciente:hover {
        background-color: #2c5282;
        }

        .btn-doctor {
        background-color: #319795;
        }
        .btn-doctor:hover {
        background-color: #2c7a7b;
        }

        .btn-admin {
        background-color: #4a5568;
        }
        .btn-admin:hover {
        background-color: #2d3748;
        }
    </style>
</head>

<body>

  <main class="container">
    <h1>CuraTech</h1>
    <p>Selecciona tu tipo de usuario para ingresar</p>
    <form th:action="@{/set-role}" method="post">
        <div class="button-group">
            <button class="btn btn-paciente" name= "role" value= "PACIENTE" type="submit">Paciente</button>
            <button class="btn btn-doctor" name= "role" value= "MEDICO" type="submit">Doctor</button>
            <button class="btn btn-admin" name= "role" value= "ADMIN" type="submit">Administrador</button>
        </div>
    </form>
  </main>

</html>
