<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="utf-8">

    <title>Medicore - Registrar Empleado</title>

    <!-- Custom fonts for this template-->
    <link th:href="@{/vendor/fontawesome-free/css/all.min.css}" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i" rel="stylesheet">

    <!-- Custom styles for this template-->
    <link th:href="@{/css/sb-admin-2.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Personalización de colores Azul-Morado -->
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #4e73df 0%, #6f42c1 100%);
            --accent-purple: #6f42c1;
            --accent-blue: #4e73df;
        }

        .bg-purple-gradient {
            background: var(--primary-gradient);
        }

        .text-purple {
            color: var(--accent-purple) !important;
        }

        .btn-purple {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-purple:hover {
            opacity: 0.9;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(111, 66, 193, 0.3);
        }

        .card-custom {
            border: none;
            border-top: 4px solid var(--accent-purple);
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--accent-purple);
            box-shadow: 0 0 0 0.2rem rgba(111, 66, 193, 0.25);
        }
    </style>

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <aside th:replace="~{fragments/adminSidebar :: adminSidebar}"></aside>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content" class="bg-light">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow-sm">
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3 text-purple">
                        <i class="fa fa-bars"></i>
                    </button>

                    <h1 class="h4 mb-0 text-gray-800 font-weight-bold">
                        <i class="bi bi-person-plus-fill text-purple mr-2"></i>Gestión de Personal
                    </h1>

                    <!-- Topbar Navbar -->
                    <ul class="navbar-nav ml-auto">
                        <div class="topbar-divider d-none d-sm-block"></div>
                        <!-- User Information -->
                        <li class="nav-item dropdown no-arrow">
                            <a class="nav-link dropdown-toggle" href="#">
                                <span class="mr-2 d-none d-lg-inline text-gray-600 small font-weight-bold">Administrador</span>
                                <div class="img-profile rounded-circle bg-purple-gradient d-flex align-items-center justify-content-center text-white font-weight-bold" style="width: 32px; height: 32px;">
                                    A
                                </div>
                            </a>
                        </li>
                    </ul>
                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid px-4">

                    <!-- Tarjeta Principal del Formulario -->
                    <div class="card shadow card-custom mb-4">
                        <div class="card-header py-3 bg-white d-flex align-items-center justify-content-between">
                            <h6 class="m-0 font-weight-bold text-purple">
                                <i class="bi bi-card-heading mr-2"></i>Registro de Nuevo Empleado
                            </h6>
                            <span class="badge badge-light text-purple p-2 border">Modulo Medicore</span>
                        </div>

                        <div class="card-body p-4">
                            <form>
                                <!-- Sección 1: Datos Personales -->
                                <h6 class="text-xs font-weight-bold text-purple text-uppercase mb-3">
                                    Información Personal
                                </h6>
                                
                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Nombres</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text bg-white"><i class="bi bi-person text-purple"></i></span>
                                            </div>
                                            <input type="text" class="form-control" placeholder="Ej. Juan Carlos">
                                        </div>
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Apellidos</label>
                                        <input type="text" class="form-control" placeholder="Ej. Pérez Gómez">
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Tipo de Documento</label>
                                        <select class="form-control">
                                            <option selected disabled>Seleccionar...</option>
                                            <option>Cédula de Ciudadanía</option>
                                            <option>Cédula de Extranjería</option>
                                            <option>Pasaporte</option>
                                        </select>
                                    </div>
                                </div>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Número de Documento</label>
                                        <input type="text" class="form-control" placeholder="1234567890">
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Teléfono / Celular</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text bg-white"><i class="bi bi-telephone text-purple"></i></span>
                                            </div>
                                            <input type="text" class="form-control" placeholder="300 000 0000">
                                        </div>
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Correo Electrónico</label>
                                        <div class="input-group">
                                            <div class="input-group-prepend">
                                                <span class="input-group-text bg-white"><i class="bi bi-envelope text-purple"></i></span>
                                            </div>
                                            <input type="email" class="form-control" placeholder="empleado@medicore.com">
                                        </div>
                                    </div>
                                </div>

                                <hr class="my-4">

                                <!-- Sección 2: Datos Laborales y Rol -->
                                <h6 class="text-xs font-weight-bold text-purple text-uppercase mb-3">
                                    Información del Cargo y Rol
                                </h6>

                                <div class="row">
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Cargo / Especialidad</label>
                                        <input type="text" class="form-control" placeholder="Ej. Médico General, Recepcionista">
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Asignación de Rol</label>
                                        <select class="form-control">
                                            <option selected disabled>Seleccionar Rol...</option>
                                            <option>ADMINISTRADOR</option>
                                            <option>EMPLEADO / MÉDICO</option>
                                            <option>RECEPCION</option>
                                        </select>
                                    </div>

                                    <div class="col-md-4 mb-3">
                                        <label class="form-label text-gray-700 font-weight-bold small">Estado Inicial</label>
                                        <select class="form-control">
                                            <option>Activo</option>
                                            <option>Inactivo</option>
                                        </select>
                                    </div>
                                </div>

                                <!-- Botones de Acción -->
                                <div class="row mt-4">
                                    <div class="col-12 d-flex justify-content-end gap-2">
                                        <button type="button" class="btn btn-light border mr-2 font-weight-bold text-gray-700">
                                            <i class="bi bi-x-circle mr-1"></i> Cancelar
                                        </button>
                                        <button type="button" class="btn btn-purple font-weight-bold px-4">
                                            <i class="bi bi-check-circle-fill mr-1"></i> Registrar Empleado
                                        </button>
                                    </div>
                                </div>

                            </form>
                        </div>
                    </div>

                </div>
                <!-- /.container-fluid -->

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white shadow-sm mt-auto">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto text-gray-600">
                        <span>Medicore System &copy; 2026</span>
                    </div>
                </div>
            </footer>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

</body>

</html>
